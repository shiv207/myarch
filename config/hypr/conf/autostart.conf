exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = swayosd-server --config /home/shiv/.config/swayosd/config.toml --style /home/shiv/.config/swayosd/style.css
exec-once = swaync
exec-once = awww-daemon & sleep 0.5 & awww init

# Setup fcitx5
exec-once = export GTK_IM_MODULE=fcitx5
exec-once = export QT_IM_MODULE=fcitx5
exec-once = export XMODIFIERS=@im=fcitx5
exec-once = export INPUT_METHOD=fcitx5
exec-once = export SDL_IM_MODULE=fcitx5
exec-once = fcitx5

# Setup screen sharing
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Setup clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Setup themes
exec-once = ~/.config/viegphunt/gtkthemes.sh
exec-once = sleep 1 && hyprctl setcursor macOS 30