# Merged Hyprland binds
# Visual / rice actions  → myarch (https://github.com/shiv207/myarch)
# Window / workspace nav → kurealnum i3, ported (https://github.com/kurealnum/dotfiles)
# Conflicts and relocations: see README.md

$mainMod = SUPER

# --- Terminal ---
# kurealnum: Super+Return. myarch: Super+Space. Both kept.
# Both the main Enter (Return) and numpad Enter (KP_Enter) open the terminal.
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, KP_Enter, exec, $terminal
bind = $mainMod, Space, exec, $terminal

# --- Apps (myarch) ---
bind = $mainMod, C, exec, whatsapp-linux-desktop
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, B, exec, $browser

# --- Close / exit ---
bind = $mainMod Shift Control, Escape, exit,
bind = $mainMod, Q, killactive,
bind = $mainMod Shift, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill
bind = $mainMod SHIFT, V, killactive,   # kurealnum Super+Shift+V

# --- Layout ---
# CONFLICT: kurealnum Super+F = fullscreen, myarch Super+F = float.
# Default: kurealnum fullscreen. Float is Super+Shift+Space (kurealnum).
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, Space, togglefloating
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, backslash, layoutmsg, togglesplit # relocated from myarch Super+J
bind = $mainMod, G, togglegroup          # closest Hyprland analog to i3 tabbed
bind = $mainMod, Tab, cyclenext          # closest to i3 floating/tiling focus toggle

# --- Relocated myarch binds that collided with vim hjkl ---
# CONFLICT: kurealnum Super+H/L = focus. myarch Super+H = hints, Super+L = lock.
# Super+Shift+L is move-window-right (kurealnum), so lock is Super+Escape.
bind = $mainMod, slash, exec, ~/.config/viegphunt/key_hints.sh
bind = $mainMod, Escape, exec, hyprlock

# --- Launchers / rice tools (myarch visual + workflow scripts) ---
bind = Alt, Space, exec, ~/.config/viegphunt/app_launcher.sh
bind = $mainMod, D, exec, ~/.config/viegphunt/app_launcher.sh   # kurealnum Super+D
bind = $mainMod, M, exec, wlogout                               # kurealnum Super+M powermenu
bind = $mainMod, PERIOD, exec, ~/.config/viegphunt/emoji_launcher.sh
bind = $mainMod, V, exec, ~/.config/viegphunt/clipboard_launcher.sh
bind = $mainMod, W, exec, ~/.config/viegphunt/wallpaper_select.sh
bind = $mainMod, T, exec, ~/.config/viegphunt/theme_select.sh
bind = CTRL, W, exec, ~/.config/viegphunt/wallpaper_select.sh
bind = $mainMod Shift, W, exec, ~/.config/viegphunt/wallpaper_random.sh
bind = $mainMod, N, exec, ~/.config/viegphunt/wallpaper_cycle.sh
bind = $mainMod ALT, A, exec, aether
bind = $mainMod Shift, S, exec, hyprshot -m region -o $HOME/Pictures/Screenshots
bind = , Print, exec, hyprshot -m region -o $HOME/Pictures/Screenshots  # kurealnum Print (Wayland: hyprshot, not flameshot)

# --- Focus: kurealnum vim keys + myarch arrows ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# --- Move window: kurealnum Super+Shift+hjkl ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# --- Workspaces (both; includes 10 on Super+0 from both) ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move workspace between monitors (kurealnum)
bind = $mainMod, Right, movecurrentworkspacetomonitor, r
bind = $mainMod, Left, movecurrentworkspacetomonitor, l
bind = $mainMod, Up, movecurrentworkspacetomonitor, u
bind = $mainMod, Down, movecurrentworkspacetomonitor, d

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Resize submap (kurealnum Super+R) ---
bind = $mainMod, R, submap, resize
submap = resize
binde = , H, resizeactive, -40 0
binde = , J, resizeactive, 0 40
binde = , K, resizeactive, 0 -40
binde = , L, resizeactive, 40 0
binde = , left, resizeactive, -40 0
binde = , down, resizeactive, 0 40
binde = , up, resizeactive, 0 -40
binde = , right, resizeactive, 40 0
bind = , Return, submap, reset
bind = , KP_Enter, submap, reset
bind = , Escape, submap, reset
bind = $mainMod, R, submap, reset
submap = reset

# --- Volume / brightness (myarch OSD, not dunst/i3blocks) ---
bind = ,XF86AudioRaiseVolume, exec, ~/.local/bin/vol-osd raise
bind = ,XF86AudioLowerVolume, exec, ~/.local/bin/vol-osd lower
bind = ,XF86AudioMute, exec, ~/.local/bin/vol-osd mute
bind = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bind = ,XF86MonBrightnessUp, exec, ~/.local/bin/brightness-osd up
bind = ,XF86MonBrightnessDown, exec, ~/.local/bin/brightness-osd down

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
