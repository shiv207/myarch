$active_border = rgba({color5.strip}ff)
$inactive_border = rgba({color8.strip}ff)

general {
    gaps_in = 4
    gaps_out = 8

    border_size = 2

    col.active_border = $active_border
    col.inactive_border = $inactive_border

    resize_on_border = true

    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = {background.rgba:0.93}
    }

    blur {
        enabled = yes
        size = 6
        passes = 3
    }
}

# Blur waybar
layerrule = blur on, match:namespace waybar
# Blur wlogout
layerrule = blur on, match:namespace logout_dialog
# Blur swaync
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window